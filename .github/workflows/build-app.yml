# בונה את app/ (קישור למיזוג האחרון, בלי Vercel) בכל דחיפה ל-main.
name: build-app
on:
  push:
    branches: [main]
    paths-ignore: ['app/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build:github
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app
          git diff --cached --quiet || (git commit -m "build: app/" && git push)
